[project]

name = "chat"

version = "0.1.0"

description = "Chat service for store customer conversations."

requires-python = ">=3.13"

dependencies = [
    "alembic>=1.16,<2.0",
    "asyncpg>=0.30,<1.0",
    "google-genai>=2.29.0,<3.0.0",
    "grpcio>=1.84.0",
    "jsonschema>=4.26.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
]

[dependency-groups]

dev = [
    "grpcio-tools>=1.84.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
]

[build-system]

requires = ["uv_build>=0.12.1,<0.13.0"]

build-backend = "uv_build"

[tool.uv.build-backend]

module-name = [
    "application",
    "domain",
]

[tool.pytest.ini_options]

pythonpath = ["src"]

testpaths = ["test"]
