syntax = "proto3";

package order.v1;

option go_package = "github.com/iheanyi-dev/ecommerce-backend/proto/order/v1;orderv1";

import "google/protobuf/timestamp.proto";

service OrderService {
  rpc ListStoreOrders(ListStoreOrdersRequest) returns (ListStoreOrdersResponse);
  rpc GetStoreOrder(GetStoreOrderRequest) returns (GetStoreOrderResponse);
  rpc AddShipping(AddShippingRequest) returns (OrderActionResponse);
  rpc MarkSent(MarkSentRequest) returns (OrderActionResponse);
  rpc CancelStoreOrder(CancelStoreOrderRequest) returns (OrderActionResponse);
}

message OrderProduct {
  string id = 1;
  string order_id = 2;
  string product_id = 3;
  string name = 4;
  int64 quantity = 5;
  int64 price_minor = 6;
}

message Order {
  string id = 1;
  string cart_id = 2;
  string store_id = 3;
  string customer_id = 4;
  string delivery_location = 5;
  int64 price_product = 6;
  int64 price_shipping = 7;
  string currency = 8;
  string state = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  repeated OrderProduct products = 12;
}

message ListStoreOrdersRequest {
  string store_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListStoreOrdersResponse {
  repeated Order orders = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 total_items = 4;
  int64 total_pages = 5;
}

message GetStoreOrderRequest {
  string store_id = 1;
  string order_id = 2;
}

message GetStoreOrderResponse {
  Order order = 1;
}

message AddShippingRequest {
  string store_id = 1;
  string order_id = 2;
  int64 shipping_amount = 3;
}

message MarkSentRequest {
  string store_id = 1;
  string order_id = 2;
}

message CancelStoreOrderRequest {
  string store_id = 1;
  string order_id = 2;
}

message OrderActionResponse {
  bool success = 1;
}
