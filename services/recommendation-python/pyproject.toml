[project]
name = "recommendation-python"
version = "0.1.0"
description = "Python implementation of the Recommendation Service."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiokafka>=0.14.0",
    "fastapi>=0.117.0",
    "huggingface-hub>=0.36.0",
    "opentelemetry-api>=1.39.0",
    "protobuf>=7.36.2",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "torch==2.14.1",
    "transformers==4.39.1",
    "uvicorn[standard]>=0.36.0",
]

[dependency-groups]
dev = [
    "opentelemetry-sdk>=1.39.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = [
    "domain",
    "application",
    "infrastructure",
    "presentation",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
