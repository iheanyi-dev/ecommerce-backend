[package]
name = "embedding"
version = "0.1.0"
edition = "2024"

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
hf-hub = { version = "0.4", features = ["ureq"] }
serde_json = "1.0.154"
tokenizers = "0.22.2"
uuid = { version = "1", features = ["v4"] }
rdkafka = { version = "0.38", features = ["tokio", "cmake-build"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures-util = "0.3"
qdrant-client = "1.20"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
prost = "0.14"
pdf-extract = "0.10"
