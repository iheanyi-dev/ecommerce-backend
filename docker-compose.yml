services:
  identity-db:
    image: postgres:17
    container_name: e-identity-db
    restart: unless-stopped

    env_file:
      - ./services/identity/.env.db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - ecommerce

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile

    container_name: e-identity
    restart: unless-stopped

    env_file:
      - ./services/identity/.env

    environment:
      DATABASE_HOST: identity-db
      DATABASE_PORT: 5432

    depends_on:
      identity-db:
        condition: service_healthy

    ports:
      - "8080:8080"

    networks:
      - ecommerce

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile

    container_name: e-gateway
    restart: unless-stopped

    env_file:
      - ./gateway/.env

    environment:
      IDENTITY_SERVICE_URL: http://identity:8080

    depends_on:
      identity:
        condition: service_started

    ports:
      - "8081:8081"

    networks:
      - ecommerce

  redpanda:
    image: redpandadata/redpanda:v25.2.1
    container_name: e-redpanda
    restart: unless-stopped

    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145

    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"

    volumes:
      - redpanda_data:/var/lib/redpanda/data

    networks:
      - ecommerce

networks:
  ecommerce:
    driver: bridge

volumes:
  postgres_data:
  redpanda_data:
