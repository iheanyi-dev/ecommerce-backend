[project]
name = "embedding-python"
version = "0.1.0"
description = "Embedding and knowledge retrieval service."
requires-python = ">=3.13"
dependencies = [
    "torch>=2.4,<3.0",
    "transformers>=4.39,<5.0",
    "qdrant-client>=1.19.1,<2.0",
    "grpcio>=1.70,<2.0",
    "opentelemetry-api>=1.39.0",
    "opentelemetry-sdk>=1.39.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.0",
    "python-dotenv>=1.0,<2.0",
    "pypdf>=5.0,<7.0",
    "aiokafka>=0.14.0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.70,<2.0",
    "protobuf>=5.29,<8.0",
    "pytest>=8.4.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["domain", "application", "infrastructure", "presentation", "embedding"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
