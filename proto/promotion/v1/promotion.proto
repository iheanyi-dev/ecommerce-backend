syntax = "proto3";

package promotion.v1;

option go_package = "github.com/iheanyi-dev/ecommerce-backend/proto/promotion/v1;promotionv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service PromotionService {
  rpc CreatePromotion(CreatePromotionRequest) returns (PromotionResponse);

  rpc GetPromotionByID(GetPromotionByIDRequest) returns (PromotionResponse);
  rpc GetPromosForUser(GetPromosForUserRequest) returns (ListPromotionsResponse);
  rpc GetPromoForUser(GetPromoForUserRequest) returns (PromotionResponse);
  rpc GetPromosByStore(GetPromosByStoreRequest) returns (ListPromotionsResponse);

  rpc ActivatePromotion(PromotionLifecycleRequest) returns (PromotionResponse);
  rpc CancelPromotion(PromotionLifecycleRequest) returns (PromotionResponse);
  rpc ExpirePromotion(PromotionLifecycleRequest) returns (PromotionResponse);
  rpc RenewPromotion(RenewPromotionRequest) returns (PromotionResponse);
  rpc DeletePromotion(PromotionLifecycleRequest) returns (google.protobuf.Empty);
}

message Money {
  int64 amount = 1;
  string currency = 2;
}

message Promotion {
  string id = 1;
  string store_id = 2;
  optional string product_id = 3;
  optional string customer_id = 4;
  optional int64 percentage_basis_points = 5;
  Money fixed_amount = 6;
  google.protobuf.Timestamp starts_at = 7;
  google.protobuf.Timestamp ends_at = 8;
  string status = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message CreatePromotionRequest {
  string store_id = 1;
  optional string product_id = 2;
  optional string customer_id = 3;
  optional int64 percentage_basis_points = 4;
  Money fixed_amount = 5;
  google.protobuf.Timestamp starts_at = 6;
  google.protobuf.Timestamp ends_at = 7;
}

message GetPromotionByIDRequest {
  string promotion_id = 1;
}

message GetPromosForUserRequest {
  string customer_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetPromoForUserRequest {
  string store_id = 1;
  string product_id = 2;
  string customer_id = 3;
}

message GetPromosByStoreRequest {
  string store_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message PromotionLifecycleRequest {
  string promotion_id = 1;
}

message RenewPromotionRequest {
  string promotion_id = 1;
  google.protobuf.Timestamp starts_at = 2;
  google.protobuf.Timestamp ends_at = 3;
}

message PromotionResponse {
  Promotion promotion = 1;
}

message ListPromotionsResponse {
  repeated Promotion promotions = 1;
}
