[project]
name = "recommendation-python"
version = "0.1.0"
description = "Python implementation of the Recommendation Service."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = [
    "domain",
    "application",
    "infrastructure",
    "presentation",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
