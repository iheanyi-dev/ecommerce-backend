[project]
name = "embedding-python"
version = "0.1.0"
description = "Embedding and knowledge retrieval service."
requires-python = ">=3.13"
dependencies = [
    "torch>=2.4,<3.0",
    "transformers>=4.39,<5.0",
    "qdrant-client>=1.19.1,<2.0",
]

[dependency-groups]
dev = ["pytest>=8.4.0"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["domain"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
